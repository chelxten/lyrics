<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lyrics Library</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <a href="#/" class="brand">Lyrics Library</a>
  </header>

  <main>
    <section id="list-view">
      <label class="search">
        <span class="visually-hidden">Search songs</span>
        <input id="q" type="search" placeholder="Search a title, artist, or a line you remember…" autocomplete="off" autofocus>
      </label>
      <p id="count" class="muted"></p>
      <ul id="results" class="results"></ul>
    </section>

    <article id="song-view" hidden></article>
  </main>

  <script src="app.js"></script>
</body>
</html>
